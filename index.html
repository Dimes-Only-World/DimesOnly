    <script>
      // Hide URL bar on mobile devices
      function hideAddressBar() {
        if (window.innerHeight < window.innerWidth) return; // Skip on landscape

        setTimeout(function () {
          if (window.scrollY === 0) {
            window.scrollTo(0, 1);
          }
        }, 100);

        setTimeout(function () {
          if (window.scrollY === 1) {
            window.scrollTo(0, 0);
          }
        }, 200);
      }

      // Apply on load and orientation change
      window.addEventListener("load", hideAddressBar);
      window.addEventListener("orientationchange", function () {
        setTimeout(hideAddressBar, 500);
      });

      // Double-tap zoom prevention removed to fix mobile interaction issues

      // Set viewport height custom property for mobile browsers
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty("--vh", `${vh}px`);
      }

      setViewportHeight();
      window.addEventListener("resize", setViewportHeight);
      window.addEventListener("orientationchange", function () {
        setTimeout(setViewportHeight, 500);
      });
    </script>
